# Lightweight checks — no Docker / no full GA4GH stack (saves CI minutes).
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bash syntax
        run: |
          set -euo pipefail
          bash -n run
          bash -n demo/run.sh
          while IFS= read -r -d '' f; do
            bash -n "$f"
          done < <(find scripts benchmark demo -type f -name '*.sh' -print0 2>/dev/null | sort -z)

      - name: Python compile
        run: python3 -m compileall -q demo/lib scripts tests

      - name: Unit tests
        run: python3 -m unittest discover -s tests -t . -p 'test_*.py' -v

      - name: Village compose config
        run: |
          bash -n demo/scenarios/village-network/run-village-demo.sh
          bash -n demo/scenarios/raspberry-pi/install-ferrum-edge.sh
          FERRUM_IMAGE=ghcr.io/synapticfour/ferrum:pin-me \
            docker compose -f demo/scenarios/village-network/docker-compose.village.yml config >/dev/null

      - name: Africa / co-deploy imports
        run: |
          pip install --quiet pyyaml
          python3 -c "
          import sys
          sys.path.insert(0, 'demo/lib')
          import africa_feature_detect, africa_scenarios, infra_feature_detect, co_deploy_scenarios
          from evidence_contract import scenario_summary
          fs = africa_feature_detect.detect('http://127.0.0.1:1')
          assert not fs.any_available()
          s = scenario_summary({})
          assert s['verdict'] == 'not_evaluated' and s['all_passed'] is False
          print('OK')
          "
          python3 -c "import yaml; yaml.safe_load(open('demo/docker-compose.africa.yml'))"
          python3 -c "import yaml; yaml.safe_load(open('demo/docker-compose.co-deploy.yml'))"
