# Two Ferrum containers on one Docker network (labels: Kisumu / Nouna).
# Laptop simulation only — not Raspberry Pi hardware, not rural WiFi, not a conformance run.
# Stock Ferrum ignores FERRUM_AFRICA__* / FERRUM_FEDERATION__* until those features exist upstream.
# Pin FERRUM_IMAGE to a digest for any evidence you keep.

services:
  ferrum-kisumu:
    image: "${FERRUM_IMAGE:-ghcr.io/synapticfour/ferrum:pin-me}"
    environment:
      FERRUM_AFRICA__OFFLINE_FIRST: "true"
      FERRUM_AFRICA__MAX_MEMORY_MB: "1024"
      FERRUM_FEDERATION__ENABLED: "true"
      FERRUM_FEDERATION__PEERS: |
        [[federation.peers]]
        name = "Nouna-Lab"
        beacon_endpoint = "http://ferrum-nouna:8080/ga4gh/beacon/v2"
        timeout_ms = 5000
      FERRUM_NODE_NAME: "Kisumu-Lab-Kenya"
    ports:
      - "18081:8080"
    networks:
      - village-net

  ferrum-nouna:
    image: "${FERRUM_IMAGE:-ghcr.io/synapticfour/ferrum:pin-me}"
    environment:
      FERRUM_AFRICA__OFFLINE_FIRST: "true"
      FERRUM_AFRICA__MAX_MEMORY_MB: "1024"
      FERRUM_FEDERATION__ENABLED: "true"
      FERRUM_FEDERATION__PEERS: |
        [[federation.peers]]
        name = "Kisumu-Lab"
        beacon_endpoint = "http://ferrum-kisumu:8080/ga4gh/beacon/v2"
        timeout_ms = 5000
      FERRUM_NODE_NAME: "Nouna-Lab-Burkina-Faso"
    ports:
      - "18082:8080"
    networks:
      - village-net

networks:
  village-net:
    driver: bridge
